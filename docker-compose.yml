version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: fedlens_db
    environment:
      POSTGRES_USER: fomc_user
      POSTGRES_PASSWORD: fomc_password
      POSTGRES_DB: fomc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
